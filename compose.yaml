services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agromatch}
      POSTGRES_USER: ${POSTGRES_USER:-agromatch}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - agromatch-postgres-data:/var/lib/postgresql/data

volumes:
  agromatch-postgres-data:
