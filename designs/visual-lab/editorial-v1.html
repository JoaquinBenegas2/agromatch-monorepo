nt:space-between;align-items:center;margin-bottom:13px}.ranking h2{font-size:16px;font-weight:600}.candidate{width:100%;border:1px solid transparent;border-bottom-color:var(--line);background:transparent;text-align:left;display:grid;grid-template-columns:25px 1fr;gap:8px;padding:15px 9px;border-radius:5px;transition:background .2s}.candidate.active{background:#e4ead9;border-color:#a9b996}.rank-number{font-family:Georgia,serif;font-size:19px;color:#78886d}.candidate strong{font-size:17px;font-weight:550;display:block}.candidate small{font-size:10px;color:var(--muted);display:block;margin-top:3px}.candidate .reason{font-size:11px;color:#365239;margin-top:8px}.ranking .note{margin-top:15px}.result-panel{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}.result-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.result-title h2{font-size:17px}.result-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:22px}.result-metric{border-right:1px solid var(--line);padding-right:15px;font-size:12px}.result-metric:last-child{border:0;padding:0}.result-metric .value{display:block;font-size:19px;font-weight:550;line-height:1.3;margin:5px 0}.bars{display:grid;grid-template-columns:68px 1fr 36px;align-items:center;gap:5px 8px;margin:7px 0;font-size:10px}.bar-track{height:6px;background:#dce1d5}.bar-fill{height:100%;background:#a1ab93}.bar-fill.projected-bar{background:#547d3f}.result-panel.animate .result-grid{animation:reveal .65s 1.8s both}.waiting-result{margin-top:18px;display:flex;gap:18px;align-items:center;border-top:1px solid var(--line);padding-top:16px}.waiting-result .big-mark{font-family:Georgia,serif;font-style:italic;font-size:44px;color:#92a37a}.waiting-result p{font-size:12px;max-width:420px}.plan-link{white-space:nowrap}.fly-chip{position:fixed;z-index:100;pointer-events:none;background:var(--lime);color:var(--ink);padding:8px 14px;border-radius:5px;box-shadow:0 8px 30px #203d3020;font-size:12px}

/* Herd: stable identities, one point per animal. */

background:#eff1e8;padding:12px}td{padding:12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.filter-input{padding:7px 10px;font-size:12px;border:1px solid var(--line);border-radius:4px;background:#fff;max-width:160px}.import-stage{min-height:360px;border:1px dashed #a8b99a;border-radius:9px;background:#fafbf5;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding:38px}.sheet-art{transform:rotate(-6deg);box-shadow:10px 25px 45px #203d3012;border:1px solid #c5d0ba;background:white;border-radius:5px;padding:23px;max-width:320px;width:100%;justify-self:center}.sheet-line{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;padding:11px 0;border-bottom:1px solid #e6eadf;font-size:11px}.sheet-line.header{color:var(--muted);font-size:9px}.sheet-line.highlight{background:#e8efd8;margin:0 -10px;padding:11px 10px}.import-copy h2{font:italic 36px/1.1 Georgia,serif;margin:15px 0}.import-copy p{font-size:13px;color:var(--muted);margin-bottom:20px}.steps{display:flex;gap:25px;margin-bottom:22px;font-size:11px;color:var(--muted)}.steps .active{color:var(--green);font-weight:600}.mapping select{border:1px solid var(--line);border-radius:4px;padding:8px;background:white;font-size:12px}.importing .herd-dot{animation:from-sheet 1.8s cubic-bezier(.25,.65,.25,1) both}.success-heading{display:flex;align-items:center;gap:12px;margin-bottom:22px}.success-heading .check{display:grid;place-items:center;background:#e6edda;border-radius:50%;width:38px;height:38px}
/* Operational plan and advisor comparison. */
.plan-sheet{background:#fffcf2;border:1px solid #d6d9c9;border-radius:4px;padding:30px;box-shadow:0 12px 30px #203d3005}.plan-sheet .sheet-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:20px}.plan-sheet .sheet-head h2{font:italic 29px Georgia,serif}.plan-row{animation:plan-row .6s both}.plan-summary{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-top:24px}.plan-summary strong{font-size:29px;font-weight:450}.advisor-table{background:#fafbf5;border:1px solid var(--line);border-radius:8px;overflow:hidden}.advisor-head,.advisor-row{display:grid;grid-template-columns:1.3fr .45fr 1fr .85fr .7fr .65fr;align-items:center;gap:14px;padding:12px 18px}.advisor-head{background:#e9eddf;font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}.advisor-row{padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line);font-size:12px;position:relative}.advisor-row.active{background:#e7eed9}.advisor-row strong{font-weight:600}.advisor-row .btn{min-height:30px}.advisor-row small{font-size:9px;color:var(--muted);display:block}.composition{display:flex;height:7px;overflow:hidden;border-radius:1px}.composition i:nth-child(1){background:var(--sex)}.composition i:nth-child(2){background:var(--conv)}.composition i:nth-child(3){background:var(--beef)}.advisor-sort{background:#fafbf5;border:1px solid var(--line);padding:8px 11px;border-radius:4px;font-size:11px}
/* Evidence drawer, native modal focus, demo controls. */
.chat{width:285px;flex:none;border-left:1px solid var(--line);background:#fbfcf6;min-height:calc(100vh - 64px);padding:22px 19px;position:sticky;top:0}.chat h2{font-size:19px}.chat-question{display:block;text-align:left;width:100%;margin-top:10px;background:#edf1e5;border:1px solid #d6e0cc;border-radius:6px;padding:10px;font-size:11px}.chat-answer{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}.chat-answer p{font-size:14px;line-height:1.7}.chat-answer details{font-size:11px;margin:15px 0}.chat-answer .answer-number{font:italic 36px Georgia,serif;display:block;margin-bottom:10px}.chat-form{margin-top:25px;display:grid;gap:8px}.chat-form input{padding:10px;border:1px solid var(--line);border-radius:5px;width:100%;font-size:11px}.chat-shade{display:none}.modal{border:1px solid var(--line);border-radius:12px;padding:28px;max-width:620px;width:calc(100% - 32px);max-height:85vh;overflow:auto;color:var(--ink);background:#fcfcf5;box-shadow:0 30px 100px #11281f35}.modal::backdrop{background:#132d2366;backdrop-filter:blur(4px)}.modal .modal-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}.modal h2{font:italic 29px Georgia,serif}.modal p{margin:12px 0;font-size:13px}.modal ol{padding-left:20px;font-size:13px}.modal li{padding:5px 0}.modal dl{font-size:12px}.modal dt{font-weight:600;margin-top:14px}.modal dd{margin:4px 0;color:var(--muted)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:200;background:var(--ink);color:#f5f5e8;padding:12px 20px;border-radius:6px;font-size:12px;box-shadow:0 8px 25px #203d3020;max-width:90vw}.toast:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.error-text{font-size:12px;color:#863f2a;padding:10px 0}.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.swatches{display:flex;height:45px;margin-top:10px}.swatches span{flex:1}.ui-sample{margin:20px 0}
@keyframes mother-in{from{transform:translateX(0)}to{transform:translateX(12px)}}@keyframes bull-in{from{transform:translateX(0)}to{transform:translateX(-12px)}}.projected.animate .parent-mother{animation:mother-in .45s both}.projected.animate .parent-bull{animation:bull-in .45s both}

function herdSide(){const list=filteredAnimals();const a=DEMO.herd.find(a=>a.id===view.female);return `<div class="row between"><h2>${view.filter==='all'?'Tu rodeo':labels[view.filter]}</h2><span class="badge">${list.length}</span></div><div class="animal-list">${list.length?list.map(a=>`<button class="animal-row ${a.id===view.female?'active':''}" data-action="animal" data-id="${a.id}"><span>#${a.id}${a.id==='084'?' · Aurora':''}</span><span class="muted">${labels[view.usual?a.usual:a.group]}</span></button>`).join(''):'<p class="note">Sin animales para este filtro.</p>'}</div><div class="animal-detail"><span class="eyebrow muted">Animal seleccionado</span><h3>${esc(a.name)} · #${a.id}</h3><p>Genotipo: ${a.a2||'sin dato disponible'}<br>Sólidos: ${a.id==='084'?'6,8% · observado demo':'sin dato disponible'}<br>Destino: ${labels[a.group]} · propuesta</p>${link('Elegir toro '+icon('arrow'),'/motor-genetico/matching/'+a.id,'btn primary compact')}</div>`}
function herdTable(){return `<div class="table-wrap" style="max-height:355px;overflow:auto" id="herd-table"><table><caption class="sr-only">Animales del rodeo, mismo escenario que el tapiz</caption><thead><tr><th>Caravana</th><th>Destino</th><th>Genotipo disponible</th><th>Ficha</th></tr></thead><tbody>${filteredAnimals().map(a=>`<tr><td>#${a.id} ${a.id==='084'?'Aurora':''}</td><td>${labels[view.usual?a.usual:a.group]}</td><td>${a.a2||'Sin dato'}</td><td>${button('Ver animal','animal','compact ghost',`data-id="${a.id}"`)}</td></tr>`).join('')||'<tr><td colspan="4">Sin animales para este filtro.</td></tr>'}</tbody></table></div>`}
function plan(){const intro=header('Negociación y tratos / Plan','Del encuentro al <span class="serif">trabajo de mañana.</span>','Un resumen para revisar y compartir con tu inseminador.');if(!data.plan.length)return intro+state('Todavía no elegiste toros','Proyectá una combinación y agregala al plan cuando quieras conservarla.','Ir a Matching','/motor-genetico/matching/'+view.female);return intro+`<section class="plan-sheet"><div class="sheet-head"><div><span class="eyebrow muted">Documento de trabajo / Demo</span><h2>Plan de servicios</h2><p class="small muted">${esc(activeFarm().name)}</p></div><span class="brandmark">${icon('leaf')}</span></div><div class="table-wrap"><table><thead><tr><th>Vaca</th><th>Toro / Central</th><th>Tipo de semen</th><th>Objetivo</th><th>Observaciones</th><th>Acciones</th></tr></thead><tbody>${data.plan.map(p=>`<tr class="plan-row"><td><b>#${esc(p.femaleId)}</b><br>${esc(p.femaleName)}</td><td><b>${esc(p.bullName)}</b><br><small>${esc(p.central)}</small></td><td>${esc(p.semen||'Por confirmar')}</td><td>${esc(p.goal)}</td><td><small>${esc(p.notes||'Por confirmar')}</small></td><td><div class="stack">${link('Elegir otro','/motor-genetico/matching/'+p.femaleId,'text-btn')}${button('Quitar','remove-plan','compact ghost',`data-id="${p.femaleId}"`)}</div></td></tr>`).join('')}</tbody></table></div><div class="plan-summary"><div><strong>${data.plan.length}</strong><span class="small muted"> / 293 vacas planificadas · ${293-data.plan.length} pendientes</span></div>${button(icon('download')+' Exportar CSV','export','primary')}</div><div class="divider"></div><p class="note">Datos ficticios. Revisar tipo de semen, genotipos y parentesco con el asesor antes de cualquier uso real. La exportación refleja únicamente las selecciones guardadas en este escenario.</p></section>`}
function advisor(){return header('Motor genético / Panel del asesor','Diez establecimientos.<br><span class="serif">Una mirada compartida.</span>','Diez fixtures asignados al asesor para esta exploración visual.',`<select class="advisor-sort" id="advisor-sort" aria-label="Ordenar establecimientos"><option value="a2" ${view.sort==='a2'?'selected':''}>Mayor proporción A2/A2</option><option value="coverage" ${view.sort==='coverage'?'selected':''}>Mayor cobertura de datos</option><option value="pending" ${view.sort==='pending'?'selected':''}>Más plan pendiente</option></select>`)+`<div class="advisor-table" role="table" aria-label="Comparación de establecimientos"><div class="advisor-head" role="row"><span role="columnheader">Establecimiento</span><span role="columnheader">Animales</span><span role="columnheader">Composición del rodeo</span><span role="columnheader">A2/A2 entre conocidos</span><span role="columnheader">Plan pendiente</span><span role="columnheader">Acción</span></div><div id="advisor-rows">${sortedFarms().map(advisorRow).join('')}</div></div><div class="row between wrap" style="margin-top:16px"><p class="note">Composición: Sexado 120 · Convencional 85 · Carne 88.<br>Ampliación visual a diez tambos autorizados en la demo; el contrato del repo ejemplifica tres.</p><span class="badge">Sin puntaje global de tambo</span></div>`}
function sortedFarms(){return [...allowedFarms()].sort((a,b)=>view.sort==='coverage'?b.known/b.total-a.known/a.total:view.sort==='pending'?(b.total-b.planned)-(a.total-a.planned):b.a2/b.known-a.a2/a.known)}
function advisorRow(f){return `<div class="advisor-row ${view.selectedFarm===f.id?'active':''}" role="row" data-farm-row="${f.id}"><div role="cell"><strong>${f.name.replace('Tambo ','')}</strong><small>Establecimiento ficticio · ${f.id.toUpperCase()}</small></div><div role="cell">${f.total}</div><div role="cell"><div class="composition" aria-label="Sexado 120, Convencional 85, Carne 88"><i style="width:${120/293*100}%"></i><i style="width:${85/293*100}%"></i><i style="width:${88/293*100}%"></i></div></div><div role="cell"><strong>${fmt(f.a2/f.known*100,1)}%</strong> <span class="small">· ${f.a2}/${f.known}</span><small>${f.total-f.known} sin genotipo</small></div><div role="cell">${f.total-f.planned} / ${f.total}<small>Resumen ilustrativo</small></div><div role="cell">${button(view.selectedFarm===f.id?'Abrir rodeo':'Seleccionar',view.selectedFarm===f.id?'open-farm':'select-farm','compact ghost',`data-id="${f.id}"`)}</div></div>`}
function chat(){return `<button class="chat-shade" data-action="chat" aria-label="Cerrar consultas"></button><aside class="chat" id="chat-panel" aria-label="Consultas sobre el rodeo"><div class="row between"><h2>Preguntale a tus datos.</h2>${button(icon('close'),'chat','compact ghost','aria-label="Cerrar consultas"')}</div><p class="note" style="margin-top:10px">Respuestas de ejemplo, con la fuente a mano.</p>${button('¿Cuántas van a carne?','ask-beef','chat-question')}${button('¿Cuáles me sirven para leche A2?','ask-a2','chat-question')}${view.answer?chatAnswer():`<div class="chat-answer"><p class="serif">Una respuesta vale más cuando podés ver de dónde viene.</p></div>`}<form class="chat-form" id="chat-form"><label for="chat-input" class="note">Tu consulta</label><input id="chat-input" placeholder="Escribí una pregunta…" required><button class="btn compact" type="submit">Consultar ejemplo ${icon('arrow')}</button></form><p class="note" style="margin-top:12px">Sin IA conectada · datos de demostración</p></aside>`}
function chatAnswer(){if(!data.loaded)return '<div class="chat-answer"><p>Todavía no cargaste un rodeo en este escenario.</p>'+link('Cargar ejemplo','/motor-genetico/importar','btn compact')+'</div>';if(view.answer==='beef')return `<div class="chat-answer"><span class="answer-number">88 de 293.</span><p>El <b>30,0%</b> del rodeo está destinado a carne en la propuesta ilustrativa.</p><details><summary>Ver evidencia</summary><p class="note">Fuente: clasificación del rodeo · escenario demo. Se cuentan las 88 identidades del grupo Carne de la propuesta, aunque estés comparando el criterio habitual.</p></details>${button('Ver los 88 animales '+icon('arrow'),'source-beef','compact primary')}</div>`;if(view.answer==='a2')return `<div class="chat-answer"><p><b>#012, #037 y Aurora #084</b> tienen genotipo A2/A2 disponible en este fixture.</p><details><summary>Ver los datos y faltantes</summary><p class="note">#012, #037, #084: A2/A2.<br>#051, #098: A1/A2.<br>#145: A1/A1.<br>Los otros 287 animales no se pueden evaluar con este subconjunto.</p></details><p class="note">El genotipo observado no es una probabilidad de descendencia. El resumen del asesor es otro fixture, agregado.</p>${button('Ver Aurora #084','source-a2','compact primary')}</div>`;return '<div class="chat-answer"><p>Este prototipo incluye dos consultas de ejemplo. Elegí una de arriba para ver cómo una respuesta lleva a sus datos.</p></div>'}
function uiKit(){return header('Laboratorio visual / Referencia','Materiales para <span class="serif">pensar el producto.</span>','Tokens exploratorios, separados del UI kit de la aplicación.')+`<section class="card"><h2>Papel mineral, tinta y materia rural.</h2><div class="swatches">${['#F3F1E9','#FFFFFF','#182822','#203D30','#D5EF7D','#BA765C'].map(c=>`<span style="background:${c}" title="${c}"></span>`).join('')}</div><p class="note">#F3F1E9 · #FFFFFF · #182822 · #203D30 · #D5EF7D · #BA765C</p><div class="ui-sample row wrap">${button('Acción principal','guide','primary')}${button('Acción secundaria','concept','ghost')}<span class="badge dot">Datos de demostración</span><span class="pill">Sexado</span></div><h1>Una decisión más clara.</h1><h2 class="serif" style="margin-top:10px">Otra forma de mirar el rodeo.</h2><p style="margin-top:18px">La ruta /ui-kit de React permanece en la aplicación original. Esta referencia pertenece únicamente al laboratorio visual.</p></section>`}
function modal(title,content){$('#modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2>${button(icon('close'),'close-modal','compact ghost','aria-label="Cerrar diálogo"')}</div>${content}`;$('#modal').showModal()}
function closeModal(){$('#modal').close()}
function resetTransient(){view.projected=false;view.animate=false;view.chat=false;view.answer=null;view.importStep=0;view.female='084';view.filter='all';view.query='';view.usual=false;view.table=false;view.demoState='normal';view.marketStep=0;view.need=DEMO.defaultNeed;view.requested=[];view.unavailable=false;view.selectedFarm=null}
function switchFarm(id){if(!allowedFarms().some(f=>f.id===id))return;farmId=id;write('farm:'+user,farmId);data=loadScope();resetTransient()}
function refreshHerd(){if($('#selection-note'))$('#selection-note').textContent=`Cada punto conserva la identidad de un animal \u00b7 #${view.female} es el animal seleccionado.`;if($('#herd-side'))$('#herd-side').innerHTML=herdSide();if($('#herd-table'))$('#herd-table').outerHTML=herdTable();const visible=new Set(filteredAnimals().map(a=>a.id));document.querySelectorAll('.herd-dot').forEach(el=>{el.classList.toggle('dim',!visible.has(el.dataset.animal));el.classList.toggle('selected',el.dataset.animal===view.female)});document.querySelectorAll('.group-labels button').forEach(el=>{el.classList.toggle('active',el.dataset.group===view.filter);el.setAttribute('aria-pressed',String(el.dataset.group===view.filter))})}
function compare(){view.usual=!view.usual;if(view.table){render();return}const counts=view.usual?{sex:80,conv:68,beef:145}:{sex:120,conv:85,beef:88};positions(view.usual).forEach(p=>{const dot=$(`[data-animal="${p.id}"]`);if(!dot)return;dot.style.transform=`translate(${p.x}px,${p.y}px)`;dot.querySelector('circle').setAttribute('fill',colors[p.g]);dot.querySelector('title').textContent=`#${p.id} · ${labels[p.g]}`});Object.keys(counts).forEach(g=>$('#count-'+g).textContent=counts[g]);$('#scenario-label').textContent=view.usual?'Criterio habitual':'Propuesta ilustrativa';$('#compare').textContent=view.usual?'Ver propuesta':'Comparar criterio habitual';$('#compare').setAttribute('aria-pressed',String(view.usual));refreshHerd()}
function reorderAdvisor(){const rows=[...document.querySelectorAll('[data-farm-row]')];const before=new Map(rows.map(r=>[r.dataset.farmRow,r.getBoundingClientRect().top]));sortedFarms().forEach(f=>$('#advisor-rows').append(rows.find(r=>r.dataset.farmRow===f.id)));if(!reduced())rows.forEach(r=>r.animate([{transform:`translateY(${before.get(r.dataset.farmRow)-r.getBoundingClientRect().top}px)`},{transform:'translateY(0)'}],{duration:500,easing:'cubic-bezier(.2,.65,.25,1)'}))}
function saveAssignment(){const b=DEMO.bulls[view.bull],a=DEMO.herd.find(a=>a.id===view.female);const assignment={femaleId:a.id,femaleName:a.name,bullId:b.id,bullName:b.name,central:b.central,semen:b.semen,goal:DEMO.goals[view.goal],notes:'Demo · consanguinidad por confirmar'};data.plan=data.plan.filter(p=>p.femaleId!==a.id).concat(assignment);persist();const from=$('#add-plan')?.getBoundingClientRect();render();toast(`${b.name} para #${a.id} agregado al plan de demo.`);const target=$('.plan-link')?.getBoundingClientRect();if(from&&target&&!reduced()){const chip=document.createElement('div');chip.className='fly-chip';chip.textContent=`#${a.id} · ${b.name}`;chip.style.left=from.left+'px';chip.style.top=from.top+'px';document.body.append(chip);const animation=chip.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${target.left-from.left}px,${target.top-from.top}px)`,opacity:0}],{duration:650,easing:'ease-in-out'});animation.finished.finally(()=>chip.remove())}}
function exportCsv(){const headers=['Vaca','Nombre','Toro','Central','Tipo de semen','Objetivo','Observaciones'];const rows=data.plan.map(p=>['#'+p.femaleId,p.femaleName,p.bullName,p.central,p.semen||'Por confirmar',p.goal,p.notes||'Por confirmar']);const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv='\uFEFF'+[headers,...rows].map(r=>r.map(cell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`AgroMatch-plan-demo-${farmId}.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('CSV generado con las asignaciones visibles.');return csv}
function runAction(action,el){
 view.animate=false;
 switch(action){
 case 'normal':view.demoState='normal';render();break;
 case 'load':data.loaded=true;persist();view.demoState='normal';view.importStep=2;view.animate=false;render();toast('Escenario cargado: 293 animales. Podés abrir Matching o el Tablero.');break;
 case 'reset':modal('Reiniciar esta demo',`<p>Se borrarán el plan y el rodeo simulado de <b>${esc(user)} · ${esc(activeFarm().name)}</b>. Los otros escenarios se conservan.</p><div class="row">${button('Reiniciar escenario','confirm-reset','primary')}${button('Conservar','close-modal','ghost')}</div>`);break;
 case 'confirm-reset':data={loaded:false,plan:[]};persist();resetTransient();closeModal();navigate('/mercado');render();toast('Escenario reiniciado.');break;
 case 'close-modal':closeModal();break;
 case 'guide':modal('Una historia en tres minutos',`<p>Acciones manuales del presentador. Podés cargar el escenario desde el pie para ir directo al Motor.</p><ol><li><b>0–25 s · Mercado.</b> Interpretar la arada, confirmar la ficha y solicitar un servicio.</li><li><b>25–40 s · Genética.</b> Elegir “más sólidos”, confirmar la intención, importar el ejemplo y confirmar columnas.</li><li><b>40–60 s · Tablero.</b> Comparar el criterio habitual y seleccionar Aurora #084.</li><li><b>60–110 s · Torinder.</b> Elegir Atlas, proyectar cría, abrir fundamento y agregar al plan.</li><li><b>110–130 s · Plan.</b> Revisar la asignación y exportar el CSV.</li><li><b>130–145 s · Chat.</b> Volver al Motor, consultar Carne y abrir los 88 animales.</li><li><b>145–165 s · Asesor.</b> Cambiar a asesor-1, ordenar tambos, seleccionar uno y abrir su rodeo.</li><li><b>165–180 s · Mercado.</b> Cerrar con la suscripción propuesta y la neutralidad del ranking.</li></ol><p class="note">49,5% → 30,0% es un fixture narrativo, no evidencia de eficacia. No se avanza por temporizador.</p>`);break;
 case 'concept':modal('La necesidad se vuelve conexión',`<p><b>AgroMatch / Torinder · exploración visual.</b> Una herramienta con lenguaje editorial: papel mineral, tinta oscura y un escenario verde profundo para la decisión genética.</p><dl><dt>01 · Encuentro genético</dt><dd>Dos animales reconocibles, una tercera posibilidad. Selección → conexiones → silueta conceptual → datos. 2,6 segundos.</dd><dt>02 · El campo responde</dt><dd>Una frase se convierte en una ficha confirmable. Solo después, el territorio dibuja conexiones.</dd><dt>03 · Del Excel al rodeo vivo</dt><dd>Las filas se transforman en 293 marcas. El tablero conserva identidades al comparar.</dd><dt>04 · Del match al servicio</dt><dd>Una hoja operativa convierte la selección en un CSV real.</dd><dt>05 · Respuestas con fuente</dt><dd>El chat lleva al conjunto que explica; el asesor reordena establecimientos sin perder su identidad.</dd></dl><p>La propuesta usa los cinco módulos del repo. Los colores, la tipografía y las animaciones son material para discutir; no sustituyen el sistema visual oficial.</p><p class="note">No hay backend, IA, parser Excel ni cálculos genéticos. Todos los precios, animales, centrales y prestadores de este HTML son ficticios.</p>${link('Ver tokens del concepto','/ui-kit','btn ghost')}`);break;
 case 'goal':view.goal=Number(el.dataset.index);view.bull=DEMO.orders[view.goal][0];view.projected=false;view.animate=false;render();break;
 case 'bull':view.bull=Number(el.dataset.index);view.projected=false;view.animate=false;render();break;
 case 'project':view.projected=true;view.animate=true;render();break;
 case 'choose-female':navigate('/motor-genetico/tablero');break;
 case 'excluded':modal('Combinación excluida',`<span class="badge">Parentesco compartido · fixture</span><h3 style="margin-top:18px">${DEMO.excluded.name} · ${DEMO.excluded.central}</h3><p>${view.female==='084'?DEMO.excluded.reason:'Ejemplo documentado para Aurora #084: comparte padre con Faro.'}</p><p class="note">No es una opción seleccionable. El pedigree completo de las combinaciones elegibles no está disponible; no se infiere consanguinidad cero.</p>`);break;
 case 'basis':{const b=DEMO.bulls[view.bull];modal(`Qué aporta ${b.name}`,`<span class="badge">Fundamento del escenario · simulado</span><ol>${b.reasons.map(r=>`<li>${r}</li>`).join('')}</ol><p><b>Dato faltante:</b> no hay pedigree completo para estimar consanguinidad. ${b.a2==='Sin dato'?'También falta el genotipo del toro.':''}</p><div class="divider"></div><dl><dt>Madre · observado</dt><dd>${view.female==='084'?'Aurora #084: sólidos 6,8%, genotipo A2/A2.':'Este animal solo tiene los datos explícitos de su ficha; no se completan faltantes.'}</dd><dt>Cría · proyección ilustrativa</dt><dd>${view.female==='084'?`Sólidos ${fmt(b.solids,1)}%, fijados en el escenario, sin fórmula genética.`:'Sólidos no estimables con estos datos.'} A2 y consanguinidad: no estimables.</dd><dt>Certeza disponible</dt><dd>Sin intervalo de confianza ni validación científica. El ranking es relativo al objetivo; no es una probabilidad reproductiva.</dd></dl>`);break}
 case 'add-plan':if(!view.projected)break;{const existing=data.plan.find(p=>p.femaleId===view.female);if(existing&&existing.bullId!==DEMO.bulls[view.bull].id)modal('Una vaca, una asignación',`<p>#${view.female} ya tiene a <b>${esc(existing.bullName)}</b> en el plan. Elegí qué asignación conservar.</p><div class="row wrap">${button('Reemplazar por '+DEMO.bulls[view.bull].name,'replace-plan','primary')}${button('Conservar '+esc(existing.bullName),'close-modal','ghost')}</div>`);else if(existing)toast('Esta combinación ya está en el plan.');else saveAssignment();break}
 case 'replace-plan':closeModal();saveAssignment();break;
 case 'remove-plan':data.plan=data.plan.filter(p=>p.femaleId!==el.dataset.id);persist();render();toast('Asignación quitada del plan.');break;
 case 'export':if(data.plan.length)exportCsv();break;
 case 'example':view.intent=el.dataset.kind;view.need=view.intent==='genetics'?DEMO.geneticNeed:view.intent==='veterinary'?'Necesito una revisión veterinaria para mi rodeo':DEMO.defaultNeed;view.marketStep=0;render();$('#need')?.focus();break;
 case 'market-edit':view.marketStep=0;render();$('#need')?.focus();break;
 case 'edit-brief':view.marketStep=1;render();break;
 case 'available':view.unavailable=false;render();break;
 case 'unavailable':view.unavailable=true;render();break;
 case 'request':modal('Confirmar solicitud de ejemplo',`<p>Vas a solicitar arada de 40 ha a <b>${DEMO.providers[Number(el.dataset.index)].name}</b> para la próxima semana.</p><p class="note">Simulación local: no se envía ningún mensaje ni se contrata un servicio.</p>${button('Confirmar solicitud','confirm-request','primary',`data-index="${el.dataset.index}"`)}`);break;
 case 'confirm-request':view.requested=[...new Set([...view.requested,Number(el.dataset.index)])];closeModal();render();toast('Solicitud de ejemplo confirmada. Contacto ficticio disponible.');break;
 case 'sample':view.importStep=1;view.mapping=['id','a2','solids'];view.animate=false;render();break;
 case 'import-back':view.importStep=0;render();break;
 case 'confirm-mapping':{const mapped=view.mapping.filter(v=>v!=='ignore');if(!view.mapping.includes('id')){$('#mapping-error').textContent='Falta identificación. Asociá CARAVANA con Identificación.';break}if(new Set(mapped).size!==mapped.length){$('#mapping-error').textContent='Hay asociaciones repetidas. Cada interpretación puede usarse una sola vez.';break}if(view.mapping.some((v,i)=>v!==['id','a2','solids'][i])){$('#mapping-error').textContent='El ejemplo necesita CARAVANA → Identificación, CSN2 → Genotipo A2 y SÓLIDOS → Sólidos observados. No incluye procesamiento de otras asociaciones.';break}data.loaded=true;persist();view.importStep=2;view.animate=true;render();break}
 case 'repeat-import':view.animate=true;render();break;
 case 'compare':compare();break;
 case 'table':view.table=!view.table;render();break;
 case 'group':view.filter=el.dataset.group;if(route.endsWith('/importar')){navigate('/motor-genetico/tablero')}else refreshHerd();break;
 case 'animal':view.female=el.dataset.id;view.projected=false;refreshHerd();break;
 case 'chat':view.chat=!view.chat;view.animate=false;render();if(view.chat)$('#chat-panel .chat-question')?.focus();break;
 case 'ask-beef':view.answer='beef';render();break;
 case 'ask-a2':view.answer='a2';render();break;
 case 'source-beef':view.filter='beef';view.usual=false;view.query='';view.table=false;view.chat=false;navigate('/motor-genetico/tablero');break;
 case 'source-a2':view.female='084';view.filter='all';view.query='084';view.chat=false;navigate('/motor-genetico/tablero');break;
 case 'select-farm':view.selectedFarm=el.dataset.id;render();break;
 case 'open-farm':switchFarm(el.dataset.id);data.loaded=true;persist();navigate('/motor-genetico/tablero');break;
 }
}
document.addEventListener('click',e=>{if(e.target.closest('#skip')){e.preventDefault();const main=$('#main-content');main.setAttribute('tabindex','-1');main.focus();return}const el=e.target.closest('[data-action]');if(el)runAction(el.dataset.action,el);const dot=e.target.closest('[data-animal]');if(dot){view.female=dot.dataset.animal;view.projected=false;if(route.endsWith('/importar'))navigate('/motor-genetico/tablero');else refreshHerd()}if(e.target.closest('a[href^="#/"]')&&$('#modal').open)closeModal()});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='user-select'){user=el.value;write('user',user);farmId=read('farm:'+user,allowedFarms()[0].id);if(!allowedFarms().some(f=>f.id===farmId))farmId=allowedFarms()[0].id;data=loadScope();resetTransient();render()}else if(el.id==='farm-select'){switchFarm(el.value);render()}else if(el.id==='demo-state'){view.demoState=el.value;render()}else if(el.dataset.map!==undefined){view.mapping[Number(el.dataset.map)]=el.value}else if(el.id==='advisor-sort'){view.sort=el.value;reorderAdvisor()}});
document.addEventListener('input',e=>{if(e.target.id==='herd-search'){view.query=e.target.value;refreshHerd()}if(e.target.id==='need')view.need=e.target.value});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='need-form'){view.need=$('#need').value.trim();if(!view.need)return;const normalized=view.need.toLowerCase();if(/sólidos|solidos|genética|genetica|leche a2/.test(normalized)){view.intent='genetics'}else if(/veterinar/.test(normalized)){view.intent='veterinary'}else if(/ar(e|ar|ada)|hectáreas|hectareas/.test(normalized)){view.intent='machinery';const area=normalized.match(/(\d+)\s*(hect|ha)/);view.brief={service:'Arada',area:area?area[1]:'40',zone:/r[ií]o cuarto/.test(normalized)?'Río Cuarto':'Por confirmar',date:/semana que viene|próxima semana|proxima semana/.test(normalized)?'próxima semana':'Por confirmar'}}else{toast('El prototipo reconoce ejemplos de arada, veterinaria y mejora de sólidos. Elegí uno para explorar.');return}view.marketStep=1;view.requested=[];render(true)}else if(e.target.id==='brief-form'){if(view.intent==='machinery'){const fields=new FormData(e.target);for(const key of ['service','area','zone','date'])view.brief[key]=String(fields.get(key)).trim()}view.marketStep=2;view.unavailable=false;view.requested=[];render(true)}else if(e.target.id==='chat-form'){const q=$('#chat-input').value.toLowerCase();view.answer=q.includes('carne')?'beef':q.includes('a2')?'a2':'unsupported';render()}});
document.addEventListener('dragover',e=>{if(e.target.closest('#drop-zone'))e.preventDefault()});document.addEventListener('drop',e=>{if(e.target.closest('#drop-zone')){e.preventDefault();toast('El mockup no lee archivos reales. Usá “Usar archivo de ejemplo”.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&view.chat&&!$('#modal').open){view.chat=false;render()}});
function onRoute(){route=location.hash.slice(1)||'/mercado';if(route==='/'){location.replace('#/mercado');return}view.demoState='normal';view.animate=false;view.projected=false;if(!route.startsWith('/motor-genetico/'))view.chat=false;const match=route.match(/^\/motor-genetico\/matching\/([^/]+)$/);if(match){const found=DEMO.herd.find(a=>a.id===match[1]);if(found)view.female=found.id;else{view.female='084';toast('Animal no disponible en la demo. Se muestra Aurora #084.')}}render(true)}
window.addEventListener('hashchange',onRoute);
if(!location.hash)history.replaceState(null,'','#/mercado');onRoute();
</script>
</body>
